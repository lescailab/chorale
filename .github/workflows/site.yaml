# Builds the documentation site and publishes it to GitHub Pages.
#
# The narrative pages and the function reference are both generated from the
# package by site/sync.R, from vignettes/*.Rmd and man/*.Rd, so what the site
# shows and what the package ships cannot diverge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:


name: site.yaml

permissions: read-all

jobs:
  site:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Generate pages and reference from the package
        run: Rscript site/sync.R

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Deploy to GitHub pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: site/dist
